<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <rect width="400" height="220" fill="#fdf6f0"/>

  <!-- Title -->
  <text x="200" y="20" text-anchor="middle" font-family="monospace" font-size="11" fill="#c0392b" font-weight="bold">Biomedical LLM · Clinical Decision Support</text>

  <!-- Input: Clinical Notes -->
  <rect x="10" y="35" width="80" height="140" rx="6" fill="#fff" stroke="#e8e8ee" stroke-width="1.5"/>
  <text x="50" y="52" text-anchor="middle" font-family="monospace" font-size="8" fill="#c0392b" font-weight="bold">Clinical Notes</text>
  <!-- Text lines -->
  <rect x="18" y="58"  width="64" height="4" rx="2" fill="#ccc"/>
  <rect x="18" y="66"  width="55" height="4" rx="2" fill="#ccc"/>
  <rect x="18" y="74"  width="60" height="4" rx="2" fill="#ccc"/>
  <rect x="18" y="82"  width="48" height="4" rx="2" fill="#ccc"/>
  <rect x="18" y="90"  width="64" height="4" rx="2" fill="#ccc"/>
  <rect x="18" y="98"  width="52" height="4" rx="2" fill="#ccc"/>
  <rect x="18" y="106" width="60" height="4" rx="2" fill="#ccc"/>
  <rect x="18" y="114" width="44" height="4" rx="2" fill="#ccc"/>
  <rect x="18" y="122" width="64" height="4" rx="2" fill="#ccc"/>
  <rect x="18" y="130" width="50" height="4" rx="2" fill="#ccc"/>
  <rect x="18" y="138" width="58" height="4" rx="2" fill="#ccc"/>
  <rect x="18" y="146" width="64" height="4" rx="2" fill="#ccc"/>
  <rect x="18" y="154" width="38" height="4" rx="2" fill="#ccc"/>
  <!-- Med cross icon -->
  <rect x="42" y="162" width="16" height="4"  rx="1" fill="#e74c3c"/>
  <rect x="48" y="156" width="4"  height="16" rx="1" fill="#e74c3c"/>

  <!-- Arrow 1 -->
  <line x1="92" y1="105" x2="108" y2="105" stroke="#888" stroke-width="2"/>
  <polygon points="108,101 116,105 108,109" fill="#888"/>

  <!-- Tokenizer -->
  <rect x="116" y="65" width="50" height="80" rx="5" fill="#fef5e7" stroke="#e67e22" stroke-width="1.5"/>
  <text x="141" y="82" text-anchor="middle" font-family="monospace" font-size="8" fill="#e67e22" font-weight="bold">Tokenizer</text>
  <rect x="124" y="88"  width="34" height="6" rx="2" fill="#e67e22" opacity="0.4"/>
  <rect x="124" y="98"  width="28" height="6" rx="2" fill="#e67e22" opacity="0.4"/>
  <rect x="124" y="108" width="34" height="6" rx="2" fill="#e67e22" opacity="0.4"/>
  <rect x="124" y="118" width="20" height="6" rx="2" fill="#e67e22" opacity="0.4"/>
  <rect x="124" y="128" width="34" height="6" rx="2" fill="#e67e22" opacity="0.4"/>

  <!-- Arrow 2 -->
  <line x1="168" y1="105" x2="183" y2="105" stroke="#888" stroke-width="2"/>
  <polygon points="183,101 191,105 183,109" fill="#888"/>

  <!-- Transformer LLM block -->
  <rect x="190" y="40" width="80" height="130" rx="6" fill="#eaf0fb" stroke="#4E567E" stroke-width="1.5"/>
  <text x="230" y="57" text-anchor="middle" font-family="monospace" font-size="8" fill="#4E567E" font-weight="bold">Fine-tuned</text>
  <text x="230" y="67" text-anchor="middle" font-family="monospace" font-size="8" fill="#4E567E" font-weight="bold">BioLLM</text>
  <!-- Attention layers -->
  <rect x="198" y="75"  width="64" height="12" rx="3" fill="#4E567E" opacity="0.7"/>
  <text x="230" y="85" text-anchor="middle" font-family="monospace" font-size="7" fill="white">Attention Layer 1</text>
  <rect x="198" y="92"  width="64" height="12" rx="3" fill="#4E567E" opacity="0.7"/>
  <text x="230" y="102" text-anchor="middle" font-family="monospace" font-size="7" fill="white">Attention Layer 2</text>
  <rect x="198" y="109" width="64" height="12" rx="3" fill="#4E567E" opacity="0.7"/>
  <text x="230" y="119" text-anchor="middle" font-family="monospace" font-size="7" fill="white">Attention Layer 3</text>
  <rect x="198" y="126" width="64" height="12" rx="3" fill="#4E567E" opacity="0.5"/>
  <text x="230" y="136" text-anchor="middle" font-family="monospace" font-size="7" fill="white">FFN</text>
  <text x="230" y="152" text-anchor="middle" font-family="monospace" font-size="7" fill="#4E567E">PubMed + Clinical</text>
  <text x="230" y="162" text-anchor="middle" font-family="monospace" font-size="7" fill="#4E567E">fine-tuning</text>

  <!-- Arrow 3 -->
  <line x1="272" y1="105" x2="287" y2="105" stroke="#888" stroke-width="2"/>
  <polygon points="287,101 295,105 287,109" fill="#888"/>

  <!-- Output: Decision Support -->
  <rect x="294" y="40" width="96" height="130" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="342" y="57" text-anchor="middle" font-family="monospace" font-size="8" fill="#27ae60" font-weight="bold">Clinical Output</text>
  <!-- Diagnosis -->
  <rect x="302" y="65"  width="80" height="18" rx="3" fill="#27ae60" opacity="0.15"/>
  <text x="342" y="75"  text-anchor="middle" font-family="monospace" font-size="7" fill="#27ae60" font-weight="bold">Diagnosis Assist</text>
  <text x="342" y="83"  text-anchor="middle" font-family="monospace" font-size="6" fill="#555">ICD-10 coding</text>
  <!-- Drug interactions -->
  <rect x="302" y="88"  width="80" height="18" rx="3" fill="#c0392b" opacity="0.1"/>
  <text x="342" y="98"  text-anchor="middle" font-family="monospace" font-size="7" fill="#c0392b" font-weight="bold">Drug Interaction</text>
  <text x="342" y="106" text-anchor="middle" font-family="monospace" font-size="6" fill="#555">risk flagging</text>
  <!-- Summarization -->
  <rect x="302" y="111" width="80" height="18" rx="3" fill="#8e44ad" opacity="0.1"/>
  <text x="342" y="121" text-anchor="middle" font-family="monospace" font-size="7" fill="#8e44ad" font-weight="bold">Note Summary</text>
  <text x="342" y="129" text-anchor="middle" font-family="monospace" font-size="6" fill="#555">NLP extraction</text>
  <!-- Confidence -->
  <rect x="302" y="134" width="80" height="18" rx="3" fill="#e67e22" opacity="0.1"/>
  <text x="342" y="144" text-anchor="middle" font-family="monospace" font-size="7" fill="#e67e22" font-weight="bold">Confidence: 94%</text>
  <text x="342" y="152" text-anchor="middle" font-family="monospace" font-size="6" fill="#555">decision support</text>

  <!-- Bottom label -->
  <text x="200" y="196" text-anchor="middle" font-family="monospace" font-size="10" fill="#555">Newcastle University · PubMed Fine-tuning · Clinical NLP</text>
</svg>
